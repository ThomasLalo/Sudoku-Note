<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<script lang="ts">
			(function () {
				try {
					//try incase this code runs server-side where localStorage does not exist
					const savedTheme = localStorage.getItem('theme');
					if (savedTheme !== null) {
						document.documentElement.dataset.theme = savedTheme;
					}
				} catch (e) {}
			})(); //putting the parentheses at the end of this anonymous function means the function is immediately called
		</script>
		<meta charset="utf-8" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- this meta tag won't fix the autozoom on safari based browsers caused by small font sizes -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
